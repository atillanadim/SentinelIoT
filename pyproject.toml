[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sentineliot"
version = "0.1.0"
description = "Agente defensivo local com honeypot de camera IP simulada para redes IoT."
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "psutil==7.2.2",
    "pydantic==2.14.3",
    "pyyaml==6.0.3",
]

[dependency-groups]
dev = [
    "mypy==2.4.1",
    "pip-audit==2.10.1",
    "pytest==9.2.0",
    "pytest-cov==7.1.0",
    "ruff==0.17.4",
    "types-psutil>=7.2.2.20261111",
    "types-pyyaml==6.0.12.20261103",
]

[project.scripts]
sentineliot = "sentineliot.cli.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/sentineliot"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
norecursedirs = [".git", ".venv", "data", "logs"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_configs = true
files = ["src"]
