<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <title>SentinelCam - Configuração</title>
  <style>
    :root { color-scheme: dark; }
    body { font-family: system-ui, sans-serif; background: #0d1117; color: #e6edf3; margin: 0; }
    header { background: #161b22; padding: 16px 24px; border-bottom: 1px solid #30363d; }
    main { max-width: 720px; margin: 0 auto; padding: 24px; }
    .card { background: #161b22; border: 1px solid #30363d; border-radius: 10px; padding: 20px; }
    input, select { width: 100%; box-sizing: border-box; margin: 6px 0 14px; padding: 9px;
                    background: #0d1117; color: #e6edf3; border: 1px solid #30363d; border-radius: 6px; }
    button { padding: 10px 18px; background: #1f6feb; color: #fff; border: 0; border-radius: 6px; }
    small { color: #8b949e; }
  </style>
</head>
<body>
  <header><strong>SentinelCam</strong> - configuração do dispositivo</header>
  <main>
    <div class="card">
      <h2>Rede e vídeo</h2>
      <form method="post" action="/cgi-bin/sentinel_camera.py">
        <input type="hidden" name="honeypot" value="camera-config">
        <label for="hostname">Nome do dispositivo</label>
        <input id="hostname" name="hostname" value="sentinel-cam-01">
        <label for="admin_user">Usuário administrador</label>
        <input id="admin_user" name="admin_user" value="admin">
        <label for="admin_pass">Nova senha</label>
        <input id="admin_pass" name="admin_pass" type="password" placeholder="********">
        <label for="rtsp">Porta RTSP</label>
        <input id="rtsp" name="rtsp" value="554">
        <button type="submit">Aplicar</button>
      </form>
      <p><small>Alterações exigem autenticação de fábrica. Versão 1.4.2.</small></p>
    </div>
  </main>
</body>
</html>
