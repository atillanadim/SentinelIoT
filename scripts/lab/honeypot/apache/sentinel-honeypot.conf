<VirtualHost *:80>
    ServerName sentinel-camera.lab
    ServerAdmin lab@sentinel.invalid
    DocumentRoot /var/www/sentinel

    <Directory /var/www/sentinel>
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted
    </Directory>

    <Directory /usr/lib/cgi-bin>
        Options +ExecCGI
        AddHandler cgi-script .py
        Require all granted
    </Directory>

    ScriptAlias /cgi-bin/ /usr/lib/cgi-bin/

    # Formato lido pelo agente Sentinel: ip|data|metodo|caminho|query|status|ua
    LogFormat "%h|%{%Y-%m-%dT%H:%M:%S%z}t|%m|%U|%q|%>s|%{User-Agent}i" sentinel
    CustomLog /var/log/sentinel/apache/sentinel-access.log sentinel
    ErrorLog /var/log/sentinel/apache/sentinel-error.log

    # Pagina de diagnostico falsa, tipica de cameras IP.
    Alias /server-status /var/www/sentinel/server-status
</VirtualHost>
